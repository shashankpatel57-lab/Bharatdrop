name: Build MicBridge APK

on:
  pull_request:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed debug APK
        working-directory: micbridge/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp micbridge/android/app/build/outputs/apk/debug/app-debug.apk MicBridge_Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MicBridge-Android-APK
          path: MicBridge_Android.apk
          if-no-files-found: error
